<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CMS 영재 · 힌트</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{--c:#1B64DA;--t:#EEF2F8;--ink:#191F28;--mu:#6B7684;--line:#E5E8EB;--bg:#F2F4F6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:10px}
header img{height:22px}
header .tag{margin-left:auto;font-size:12px;color:var(--mu)}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--t);border-radius:16px;padding:16px 18px}
.chip{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.hero h1{margin:8px 0 2px;font-size:22px}
.hero p{margin:0;color:var(--mu);font-size:14px}
.dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}.dots i{width:8px;height:8px;border-radius:2px;background:#D5D9DF}.dots i.on{background:var(--c)}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.step button{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;border:0;background:#fff;font:inherit;font-weight:700;color:var(--ink);text-align:left;cursor:pointer;min-height:52px}
.step button .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--t);color:var(--c);display:grid;place-items:center;font-size:13px}
.step button .s{margin-left:auto;color:var(--mu);font-weight:500;font-size:13px}
.step .body{display:none;padding:0 16px 16px 52px}
.step.open .body{display:block}
.step.open button .s{display:none}
.step.locked button{color:#B0B8C1;cursor:default}
.mk{border-bottom:2px solid var(--mc)}
.mkn{display:inline;font-size:12px;font-weight:700;color:var(--mc);margin:0 4px}
ul{margin:0;padding-left:18px}
.video a{display:inline-block;background:var(--c);color:#fff;text-decoration:none;border-radius:10px;padding:10px 16px;font-weight:700}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:10px 0 30px}
</style>
</head>
<body>
<header><img src="logo.png" alt="CMS 영재"><span class="tag">잠재력을 탁월함으로</span></header>
<main id="app"><p class="empty">불러오는 중…</p></main>
<footer>목동 CMS 입시센터</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var MK = { tip: ['TIP', '#1B64DA'], warn: ['주의', '#E42939'], key: ['핵심', '#03875A'] };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function tex(t, d) { try { return window.katex ? katex.renderToString(t, { displayMode: d, throwOnError: false }) : esc(t); } catch (e) { return esc(t); } }
  function inl(s) {
    s = String(s || ''); var out = '', last = 0, m;
    var re = /\{\{(tip|warn|key|lec):([^|{}]+?)\|([^{}]*?)\}\}|\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$|\*\*([^*]+?)\*\*/g;
    while ((m = re.exec(s))) {
      out += esc(s.slice(last, m.index));
      if (m[1]) out += m[1] === 'lec' ? inl(m[2]) : '<span style="--mc:' + MK[m[1]][1] + '"><span class="mk">' + inl(m[2]) + '</span><span class="mkn">' + MK[m[1]][0] + ' ' + inl(m[3]) + '</span></span>';
      else if (m[4] != null) out += tex(m[4], true);
      else if (m[5] != null) out += tex(m[5], false);
      else out += '<b>' + inl(m[6]) + '</b>';
      last = re.lastIndex;
    }
    return out + esc(s.slice(last));
  }
  function para(s) { return String(s || '').split(/\n+/).map(function (l) { return '<p style="margin:0 0 6px">' + inl(l) + '</p>'; }).join(''); }
  var q = (new URLSearchParams(location.search).get('q') || '').trim().toUpperCase();
  if (!q) { app.innerHTML = '<p class="empty">교재의 QR 코드를 휴대폰 카메라로 찍어 주세요.</p>'; return; }
  fetch('data/qr-data.json?v=' + Math.floor(Date.now() / 300000)).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
    var a = q.slice(0, 2), A = (d.areas || {})[a], it = A && A.items[q];
    if (!it) { app.innerHTML = '<p class="empty">' + esc(q) + ' 문항의 힌트가 아직 준비되지 않았습니다.</p>'; return; }
    document.documentElement.style.setProperty('--c', A.color); document.documentElement.style.setProperty('--t', A.tint);
    var steps = [];
    it.h.forEach(function (h, i) { steps.push(['힌트 ' + (i + 1), para(h)]); });
    if (it.concepts.length) steps.push(['사용하는 개념', '<ul>' + it.concepts.map(function (c) { return '<li>' + inl(c) + '</li>'; }).join('') + '</ul>']);
    if (it.idea) steps.push(['아이디어', para(it.idea)]);
    if (it.video) steps.push(['풀이 영상', '<div class="video"><a href="' + esc(it.video) + '" target="_blank" rel="noopener">영상 보기 ▶</a></div>']);
    var dots = '<span class="dots">' + [1, 2, 3, 4, 5].map(function (i) { return '<i class="' + (i <= it.level ? 'on' : '') + '"></i>'; }).join('') + '</span>';
    app.innerHTML = '<section class="hero"><span class="chip">' + esc(A.name) + '</span><h1>' + esc(q) + dots + '</h1><p>먼저 혼자 생각해 본 뒤, 막히면 하나씩 열어 보세요.</p></section>' +
      steps.map(function (s, i) { return '<section class="step' + (i ? ' locked' : '') + '" data-i="' + i + '"><button type="button" aria-expanded="false"><span class="n">' + (i + 1) + '</span>' + esc(s[0]) + '<span class="s">' + (i ? '앞 단계를 먼저 열어요' : '눌러서 열기') + '</span></button><div class="body">' + s[1] + '</div></section>'; }).join('');
    app.addEventListener('click', function (e) {
      var b = e.target.closest('.step button'); if (!b) return; var st = b.parentNode;
      if (st.classList.contains('locked')) return;
      st.classList.add('open'); b.setAttribute('aria-expanded', 'true');
      var nx = st.nextElementSibling; if (nx && nx.classList.contains('locked')) { nx.classList.remove('locked'); nx.querySelector('.s').textContent = '눌러서 열기'; }
    });
  }).catch(function () { app.innerHTML = '<p class="empty">힌트를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</p>'; });
})();
</script>
</body>
</html>
